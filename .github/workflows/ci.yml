name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api-gateway/requirements.txt
          pip install -r services/sound-engine/requirements.txt
          pip install -r services/composition-engine/requirements.txt
          pip install -r services/marketing-agent/requirements.txt
          pip install -r services/mixing-engine/requirements.txt
          pip install -r services/mastering-engine/requirements.txt
          pip install -r services/export-pipeline/requirements.txt
          pip install -r services/quality-scoring/requirements.txt

      - name: Run tests
        run: |
          PYTHONPATH=.:services/api-gateway:services/marketing-agent:services/sound-engine:services/composition-engine:services/mixing-engine:services/mastering-engine:services/export-pipeline:services/quality-scoring pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install ruff
          ruff check . || true

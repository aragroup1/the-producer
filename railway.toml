[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 30
sleepApplication = false

[deploy.env]
PYTHONPATH = "/app:/app/services/api-gateway:/app/services/marketing-agent:/app/services/sound-engine:/app/services/composition-engine:/app/services/mixing-engine:/app/services/mastering-engine:/app/services/export-pipeline:/app/services/quality-scoring:/app/services/shopify-integration:/app/services/trend-research:/app/services/adaptive-learning:/app/services/render-queue"

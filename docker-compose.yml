version: '3.8'

services:
  # ─── Infrastructure ───────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: aimusic-postgres
    environment:
      POSTGRES_DB: aimusic
      POSTGRES_USER: aimusic
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aimusic_dev_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimusic -d aimusic"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  redis:
    image: redis:7-alpine
    container_name: aimusic-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --save 60 1 --save 300 10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ─── API Gateway ──────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: aimusic-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://aimusic:${DB_PASSWORD:-aimusic_dev_2026}@postgres:5432/aimusic
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./shared:/app/shared
      - ./output:/app/output
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    restart: unless-stopped

  # ─── Celery Workers ───────────────────────────────────────────────
  midi-worker:
    build:
      context: .
      dockerfile: services/composition-engine/Dockerfile
    container_name: aimusic-midi-worker
    command: celery -A shared.celery_config worker -Q midi -c 4 -n midi@%h --loglevel=info
    environment:
      - DATABASE_URL=postgresql://aimusic:${DB_PASSWORD:-aimusic_dev_2026}@postgres:5432/aimusic
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./shared:/app/shared
      - ./output:/app/output
      - ./models:/app/models
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A shared.celery_config inspect ping -d midi@%h || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
    restart: unless-stopped

  sound-worker:
    build:
      context: .
      dockerfile: services/sound-engine/Dockerfile
    container_name: aimusic-sound-worker
    command: celery -A shared.celery_config worker -Q sound -c 2 -n sound@%h --loglevel=info
    environment:
      - DATABASE_URL=postgresql://aimusic:${DB_PASSWORD:-aimusic_dev_2026}@postgres:5432/aimusic
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - VST_PATH=/app/vsts
      - SOUNDFONT_PATH=/app/soundfonts
    volumes:
      - ./shared:/app/shared
      - ./output:/app/output
      - ./vsts:/app/vsts
      - ./soundfonts:/app/soundfonts
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A shared.celery_config inspect ping -d sound@%h || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    restart: unless-stopped

  mix-worker:
    build:
      context: .
      dockerfile: services/mixing-engine/Dockerfile
    container_name: aimusic-mix-worker
    command: celery -A shared.celery_config worker -Q mix -c 4 -n mix@%h --loglevel=info
    environment:
      - DATABASE_URL=postgresql://aimusic:${DB_PASSWORD:-aimusic_dev_2026}@postgres:5432/aimusic
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./shared:/app/shared
      - ./output:/app/output
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A shared.celery_config inspect ping -d mix@%h || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    restart: unless-stopped

  master-worker:
    build:
      context: .
      dockerfile: services/mastering-engine/Dockerfile
    container_name: aimusic-master-worker
    command: celery -A shared.celery_config worker -Q master -c 2 -n master@%h --loglevel=info
    environment:
      - DATABASE_URL=postgresql://aimusic:${DB_PASSWORD:-aimusic_dev_2026}@postgres:5432/aimusic
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./shared:/app/shared
      - ./output:/app/output
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A shared.celery_config inspect ping -d master@%h || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    restart: unless-stopped

  export-worker:
    build:
      context: .
      dockerfile: services/export-pipeline/Dockerfile
    container_name: aimusic-export-worker
    command: celery -A shared.celery_config worker -Q export -c 4 -n export@%h --loglevel=info
    environment:
      - DATABASE_URL=postgresql://aimusic:${DB_PASSWORD:-aimusic_dev_2026}@postgres:5432/aimusic
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./shared:/app/shared
      - ./output:/app/output
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A shared.celery_config inspect ping -d export@%h || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    restart: unless-stopped

  qc-worker:
    build:
      context: .
      dockerfile: services/quality-scoring/Dockerfile
    container_name: aimusic-qc-worker
    command: celery -A shared.celery_config worker -Q qc -c 2 -n qc@%h --loglevel=info
    environment:
      - DATABASE_URL=postgresql://aimusic:${DB_PASSWORD:-aimusic_dev_2026}@postgres:5432/aimusic
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./shared:/app/shared
      - ./output:/app/output
      - ./models:/app/models
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A shared.celery_config inspect ping -d qc@%h || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped

  shopify-worker:
    build:
      context: .
      dockerfile: services/shopify-integration/Dockerfile
    container_name: aimusic-shopify-worker
    command: celery -A shared.celery_config worker -Q shopify -c 2 -n shopify@%h --loglevel=info
    environment:
      - DATABASE_URL=postgresql://aimusic:${DB_PASSWORD:-aimusic_dev_2026}@postgres:5432/aimusic
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET}
      - SHOPIFY_STORE_URL=${SHOPIFY_STORE_URL}
      - SHOPIFY_ACCESS_TOKEN=${SHOPIFY_ACCESS_TOKEN}
    volumes:
      - ./shared:/app/shared
      - ./output:/app/output
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A shared.celery_config inspect ping -d shopify@%h || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

  # ─── Celery Beat (Scheduler) ──────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: aimusic-celery-beat
    command: celery -A shared.celery_config beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://aimusic:${DB_PASSWORD:-aimusic_dev_2026}@postgres:5432/aimusic
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./shared:/app/shared
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

  # ─── Flower (Celery Monitor) ──────────────────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: aimusic-flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=${FLOWER_AUTH:-admin:change_me_in_production}
      - FLOWER_URL_PREFIX=flower
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

  # ─── Frontend ─────────────────────────────────────────────────────
  admin-dashboard:
    build:
      context: ./frontend/admin-dashboard
      dockerfile: Dockerfile
    container_name: aimusic-dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      api-gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
